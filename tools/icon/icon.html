<!doctype html>
<!-- icon.html - draws the addon icon (icons/halo.png) from tools/halo.js: the 2026 dial with its collar, centred and
     whole, over a flat grey (the middle stop of the halo renders' neutral backdrop, tools/gmeter/render.html, so the
     dark lower collar keeps an edge against it). make_icon.py runs it through a
     headless browser (--dump-dom) and reads {fontLoaded, png} from <pre id="out">.
     URL: ?size=<px, default 256>&scale=<px per HUD unit, default 2.95> -->
<html><head><meta charset="utf-8">
<style>@font-face { font-family: HaloSaira; src: url(../tower/saira.ttf) format('truetype'); font-weight: 100 900; font-stretch: 50% 125%; }</style>
</head><body><pre id="out">running</pre>
<script src="../halo.js"></script>
<script>
  // the state every halo comparison uses (tools/gmeter/render.py BASE): 201 km/h, OVERTAKE lit, battery 60 %
  const STATE = { kmh: 201, boost: false, ot: true, recharge: 0, deploy: 1, throttle: 1, brake: 0, soc: 0.6, aero: false,
                  aeroTint: false, gear: 5, rpm: 0.55, turn: 5, turnDir: 'L', driver: 'CAMARA', pos: 15, rival: 'COLAPINTO',
                  rivalPos: 14, team: '#B6BABD', theme: 'authentic' };
  function backdrop(g, w, h) {   // flat: the render backdrop's middle stop, behind the translucent collar top and face
    g.fillStyle = '#3f464b'; g.fillRect(0, 0, w, h);
  }
  (async () => {
    await Promise.all([300, 400, 700, 740, 760, 780, 800].map(w => document.fonts.load(`${w} 32px HaloSaira`, 'KM/HMPBOSTVERAK0123456789')));
    const q = new URLSearchParams(location.search);
    const N = +(q.get('size') || 256), s = +(q.get('scale') || 2.95);
    const c = document.createElement('canvas'); c.width = N; c.height = N;
    const g = c.getContext('2d');
    backdrop(g, N, N);
    g.setTransform(s, 0, 0, s, N / 2, N / 2); g.lineJoin = 'round';
    const I = HALO.internals;
    g.save(); I.centreFrame(g, STATE); I.drawCollar(g); HALO.parts.drawDial(g, STATE); g.restore();
    document.getElementById('out').textContent = JSON.stringify({ fontLoaded: document.fonts.check('700 20px HaloSaira'),
                                                                   size: N, scale: s, png: c.toDataURL('image/png') });
    document.title = 'done';
  })().catch(e => { document.getElementById('out').textContent = 'ERROR ' + e.stack; document.title = 'error'; });
</script>
</body></html>
